# Ideiglenes munka: a Bratanki Kánon képeinek letöltése a Wikimedia Commonsból (szabad licencű képek).
# A sandbox megosztott IP-jét a Wikimedia erősen korlátozza, ezért a letöltés itt fut; az ág a munka után törlődik.
name: kanon-img
on:
  push:
    branches: [kanon-img]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Képek letöltése
        working-directory: kanon
        env:
          KIMG_GAP: '1.5'
          KIMG_TGAP: '0.6'
        run: |
          python3 -u fetch_img.py --wiki wiki_all.txt 2>&1 | tee log1.txt
          python3 -u fetch_img.py --wiki wiki_all2.txt 2>&1 | tee log2.txt
          python3 -u fetch_img.py 2>&1 | tee log3.txt
      - name: Eredmény vissza az ágra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kanon
          git commit -q -m "kanon-img: letöltött képek" || echo "nincs változás"
          git push
